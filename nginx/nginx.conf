worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream="$upstream_addr"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    sendfile        on;
    keepalive_timeout 65;

    # ---------------------------------------------------------------
    # Gzip compression
    # ---------------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # ---------------------------------------------------------------
    # Backend upstream pool – least_conn picks the instance with the
    # fewest active connections (better than round-robin for I/O work)
    # ---------------------------------------------------------------
    upstream backend_pool {
        least_conn;
        server backend-1:5001;
        server backend-2:5002;
        server backend-3:5003;

        # Keep connections alive to backend instances
        keepalive 32;
    }

    # ---------------------------------------------------------------
    # Frontend upstream
    # ---------------------------------------------------------------
    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ---------------------------------------------------------------
    # Main server block
    # ---------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Max upload size (for future file-upload features)
        client_max_body_size 10M;

        # ----------------------------------------------------------
        # Backend: REST API routes
        # ----------------------------------------------------------
        location /api/ {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;

            # Disable buffering for streaming responses
            proxy_buffering off;
        }

        # ----------------------------------------------------------
        # Backend: Short-code redirects  /:code
        # Keep this AFTER /api/ to avoid shadowing API routes.
        # Only match paths that look like short codes (alphanumeric,
        # hyphens, underscores, 3-50 chars).
        # ----------------------------------------------------------
        location ~* ^/([a-zA-Z0-9_-]{3,50})$ {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 10s;
            proxy_read_timeout    10s;
            proxy_send_timeout    10s;
        }

        # ----------------------------------------------------------
        # Frontend: Next.js (everything else)
        # ----------------------------------------------------------
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Required for Next.js hot-reload websocket
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        # ----------------------------------------------------------
        # Nginx health-check endpoint
        # ----------------------------------------------------------
        location /nginx-health {
            access_log off;
            return 200 "nginx ok\n";
            add_header Content-Type text/plain;
        }
    }
}
